name: BIST Night Recap

on:
  # 23:30 UTC Mon-Fri = 02:30 Istanbul Tue-Sat, i.e. once after each
  # trading day's close (Monday's session recapped early Tuesday, etc.)
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch: {}

jobs:
  night-recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python night_recap.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
