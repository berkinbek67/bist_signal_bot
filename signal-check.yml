name: BIST Signal Check

on:
  # Runs every 15 min, every day. The script itself checks
  # is_forex_market_open() and skips silently on the weekend gap --
  # simpler and more precise than trying to encode "closed Sat, closed
  # Sun before 22:00 UTC, closed Fri after 22:00 UTC" in cron syntax.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python check_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
