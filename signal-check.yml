name: Crypto Signal Check

on:
  # Every 15 min, only during BIST's 10:00-18:00 Istanbul session (Istanbul
  # is UTC+3 year-round, so that's 07:00-14:59 UTC), Monday-Friday only.
  schedule:
    - cron: '*/15 7-14 * * 1-5'
  workflow_dispatch: {}

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python check_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
